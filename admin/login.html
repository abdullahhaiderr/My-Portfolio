<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="robots" content="noindex,nofollow">
  <title>Sign in | Creative Haider Admin</title>
  
    <link rel="icon" type="image/png" href="/images/creative-haider-favicon.png?v=20260924c">
    <link rel="shortcut icon" type="image/png" href="/images/creative-haider-favicon.png?v=20260924c">
    <link rel="apple-touch-icon" href="/images/creative-haider-favicon.png?v=20260924c">
<link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <link rel="stylesheet" href="/admin/admin.css">
</head>
<body class="login-body">
  <main class="login-card">
    <a href="/" class="admin-brand login-brand"><img class="admin-brand-logo login-logo" src="/images/creative-haider-logo.png?v=20260924b" alt="Creative Haider"></a>
    <div class="login-copy"><p class="eyebrow">Private access</p><h1>Welcome back</h1><p>Sign in with your Supabase admin account.</p></div>
    <div id="loginError" class="login-error" hidden></div>
    <form id="loginForm" class="login-form">
      <label><span>Email</span><input name="email" type="email" autocomplete="email" required></label>
      <label><span>Password</span><input name="password" type="password" autocomplete="current-password" required></label>
      <button class="btn btn-primary" type="submit"><i class="fas fa-right-to-bracket"></i> Sign in</button>
    </form>
    <a href="/" class="back-link"><i class="fas fa-arrow-left"></i> Back to portfolio</a>
  </main>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="/js/supabase-config.js"></script>
  <script>
    (async function () {
      const client = window.getCreativeHaiderSupabase && window.getCreativeHaiderSupabase();
      const errorBox = document.getElementById('loginError');
      if (!client) {
        errorBox.hidden = false;
        errorBox.textContent = 'Supabase is not configured yet.';
        return;
      }
      const { data: { session } } = await client.auth.getSession();
      if (session) { location.replace('/admin'); return; }

      document.getElementById('loginForm').addEventListener('submit', async (e) => {
        e.preventDefault();
        const btn = e.currentTarget.querySelector('button');
        const fd = new FormData(e.currentTarget);
        btn.disabled = true;
        btn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> Signing in…';
        const { error } = await client.auth.signInWithPassword({
          email: String(fd.get('email') || '').trim(),
          password: String(fd.get('password') || '')
        });
        if (error) {
          errorBox.hidden = false;
          errorBox.textContent = error.message;
          btn.disabled = false;
          btn.innerHTML = '<i class="fas fa-right-to-bracket"></i> Sign in';
          return;
        }
        location.replace('/admin');
      });
    })();
  </script>
</body>
</html>
